<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>Alkary Net - Hotspot Sync Bridge</title>
</head>
<body style="background:transparent;">
<script>
(function() {
    try {
        // Collect cards on this origin
        var list = [];
        try {
            var raw = localStorage.getItem('alkary_vouchers') || localStorage.getItem('alkary_vouchers_backup') || localStorage.getItem('alkary_saved_wallet') || '[]';
            list = JSON.parse(raw) || [];
        } catch(e) { list = []; }

        var active = '';
        try { active = localStorage.getItem('alkary_active_voucher') || ''; } catch(e){}
        if (active && list.indexOf(active) === -1) {
            list.unshift(active);
        }

        // Also check cookies
        try {
            var m = document.cookie.match(/(?:^|;\s*)alkary_cards_wallet=([^;]+)/);
            if (m) {
                var cList = JSON.parse(decodeURIComponent(m[1]));
                if (Array.isArray(cList)) {
                    cList.forEach(function(c) {
                        if (c && list.indexOf(c) === -1) list.push(c);
                    });
                }
            }
        } catch(e){}

        // Send cards to parent window
        function broadcastCards() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'ALKARY_SYNC_RESPONSE',
                    cards: list,
                    origin: window.location.origin
                }, '*');
            }
        }

        window.addEventListener('message', function(ev) {
            if (ev.data && ev.data.type === 'ALKARY_REQUEST_CARDS') {
                broadcastCards();
            } else if (ev.data && ev.data.type === 'ALKARY_PUSH_CARDS' && Array.isArray(ev.data.cards)) {
                var current = [];
                try { current = JSON.parse(localStorage.getItem('alkary_vouchers') || '[]'); } catch(e){}
                ev.data.cards.forEach(function(c) {
                    if (c && current.indexOf(c) === -1) current.unshift(c);
                });
                try { localStorage.setItem('alkary_vouchers', JSON.stringify(current)); } catch(e){}
            }
        });

        broadcastCards();
    } catch(e) {}
})();
</script>
</body>
</html>
