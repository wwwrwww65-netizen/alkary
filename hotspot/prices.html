<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#673ab7" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الباقات والأسعار</title>
  <link rel="stylesheet" href="assets/css/assets.css" />
  <link rel="stylesheet" type="text/css" href="assets/fonts/Almarai.css" />
  <link rel="stylesheet" href="assets/css/fontello.css" />
  <style>
    body {
      background: #1c1c2e;
      color: #fff;
      font-family: 'Almarai', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .card-con {
      max-width: 500px;
      margin: auto;
    }

    .back {
      text-align: center;
      margin-bottom: 10px;
    }

    .back button {
      background-color: #00AAE3;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back button:hover {
      background-color: #0077a7;
    }

    .card {
      background: #2a2a3d;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-header h3 {
      margin: 0;
      font-size: 24px;
      color: #FFDD00;
      text-align: center;
    }

    .line {
      height: 2px;
      background: linear-gradient(to right, #00AAE3, #8E2DE2);
      margin: 15px 0;
    }

    .card-body .sec {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a4f;
    }

    .card-body .sec:last-child {
      border-bottom: none;
    }

    .title {
      font-weight: bold;
      color: #bbb;
    }

    .sub-title {
      color: #fff;
    }

    /* Modal Styling */
    .alert-back {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 999;
    }

    .modal {
      background: white;
      color: #000;
      padding: 20px;
      border-radius: 12px;
      max-width: 300px;
      margin: 100px auto;
      text-align: center;
    }

    .modal-icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: #673ab7;
    }

    .modal .title {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .modal-body div {
      margin: 10px 0;
    }
  </style>
</head>
<body>

<style>
  .card-con {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    padding: 10px;
    font-family: "Tajawal", sans-serif;
    direction: rtl;
  }

  .card {
    width: 200px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    color: #fff;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  }

  .card-header {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 10px 0;
    background: rgba(255, 255, 255, 0.1);
  }

  .line {
    height: 2px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 15px;
  }

  .card-body {
    padding: 10px 15px;
    font-size: 14px;
  }

  .sec {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
  }

  .title {
    font-weight: bold;
  }

  button {
    background-color: #1a73e8;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin: 4px;
    font-family: "Tajawal", sans-serif;
  }

  button:hover {
    background-color: #125ecb;
  }

  .back {
    width: 100%;
    text-align: center;
    margin-bottom: 10px;
  }

  /* 🎨 ألوان متدرجة احترافية */
  .c1 { background: linear-gradient(135deg, #0bab64, #3bb78f); }
  .c2 { background: linear-gradient(135deg, #0575e6, #021b79); }
  .c3 { background: linear-gradient(135deg, #e52d27, #b31217); }
  .c4 { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
  .c5 { background: linear-gradient(135deg, #ff8c00, #ffb347); }
</style>

<div class="card-con">
  <div class="back"><a href="login.html"><button>🔙 الصفحة الرئيسية</button></a></div>
  <div class="back"><a href="status.html"><button>📊 صفحة الاستهلاك</button></a></div>

  <!-- باقة 200 -->
  <div class="card c1">
    <div class="card-header"><h3>200 ريال</h3></div>
    <div class="line"></div>
    <div class="card-body">
      <div class="sec"><span class="title">الوقت:</span><span class="sub-title">10 ساعات</span></div>
      <div class="sec"><span class="title">الصلاحية:</span><span class="sub-title">يوم واحد</span></div>
      <div class="sec"><span class="title">التحميل:</span><span class="sub-title">450 ميجا</span></div>
    </div>
  </div>


  <!-- باقة 500 -->
  <div class="card c3">
    <div class="card-header"><h3>500 ريال</h3></div>
    <div class="line"></div>
    <div class="card-body">
      <div class="sec"><span class="title">الوقت:</span><span class="sub-title">يوم و11 ساعة</span></div>
      <div class="sec"><span class="title">الصلاحية:</span><span class="sub-title">10 أيام</span></div>
      <div class="sec"><span class="title">التحميل:</span><span class="sub-title">1500 ميجا</span></div>
    </div>
  </div>

  <!-- باقة 1000 -->
  <div class="card c4">
    <div class="card-header"><h3>1000 ريال</h3></div>
    <div class="line"></div>
    <div class="card-body">
      <div class="sec"><span class="title">الوقت:</span><span class="sub-title">6 أيام و16 ساعة</span></div>
      <div class="sec"><span class="title">الصلاحية:</span><span class="sub-title">10 أيام</span></div>
      <div class="sec"><span class="title">التحميل:</span><span class="sub-title">3.4 جيجا</span></div>
    </div>
  </div>

  <!-- باقة 2500 -->
  <div class="card c5">
    <div class="card-header"><h3>2500 ريال</h3></div>
    <div class="line"></div>
    <div class="card-body">
      <div class="sec"><span class="title">الوقت:</span><span class="sub-title">2 أسابيع و2 يوم</span></div>
      <div class="sec"><span class="title">الصلاحية:</span><span class="sub-title">شهر</span></div>
      <div class="sec"><span class="title">التحميل:</span><span class="sub-title">6.4 جيجا</span></div>
    </div>
  </div>
</div>



</body>
</html>
