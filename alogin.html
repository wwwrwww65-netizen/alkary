<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background-color: #2b000e; background: radial-gradient(circle at 50% 20%, #4a0018 0%, #2b000e 50%, #150007 100%); min-height: 100vh;">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#24020a" />
  <meta name="view-transition" content="same-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="refresh" content="0; url=$(link-status)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>شبكة الكاري نت اللاسلكية | جاري التوجيه...</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="preload" href="assets/fonts/Almarai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" type="text/css" href="assets/fonts/Almarai.css" />
  <script src="config.js"></script>
  <script type="text/javascript">
    var target = '$(link-status)';
    if (!target || target.indexOf('$(') !== -1) target = 'status.html';
    window.location.replace(target);
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Almarai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
    }
    body {
      background-color: #2b000e;
      background: radial-gradient(circle at 50% 20%, #4a0018 0%, #2b000e 50%, #150007 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .redirect-box {
      background: rgba(36, 2, 10, 0.9);
      border: 1px solid rgba(245, 215, 127, 0.35);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(245, 215, 127, 0.2);
      border-top-color: #00e676;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <h2 style="font-size: 17px; color: #F5D77F; font-weight: 800; margin-bottom: 6px;">تم تسجيل الدخول بنجاح</h2>
    <p style="font-size: 13px; color: #c0d8f0;">جاري فتح صفحة الحالة ومتابعة الرصيد...</p>
    <div style="margin-top: 16px;">
      <a href="$(link-status)" style="color: #00e676; font-size: 12px; text-decoration: underline;">اضغط هنا إذا لم يتم التحويل تلقائياً</a>
    </div>
  </div>
</body>
</html>
